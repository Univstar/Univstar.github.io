<ul id="news-list" aria-labelledby="news">
{% for item in site.data.news %}
  <li><em>{{ item.date }}</em> &nbsp;🎉🎉 {{ item.text | markdownify | remove: '<p>' | remove: '</p>' | strip }}</li>
{% endfor %}
</ul>
{% if site.data.news.size > 5 %}
<button type="button" class="news-toggle" aria-controls="news-list" aria-expanded="false" hidden>Show more</button>
<script src="{{ '/assets/js/news.js' | relative_url }}" defer></script>
{% endif %}
